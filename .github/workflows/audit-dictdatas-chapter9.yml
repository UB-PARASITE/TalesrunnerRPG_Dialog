name: Audit DictDatas Chapter 9

on:
  push:
    branches: [main]
    paths:
      - '123.txt'
      - 'tools/audit_dictdatas_chapter9.py'
      - '.github/workflows/audit-dictdatas-chapter9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Scan DictDatas
        run: |
          python tools/audit_dictdatas_chapter9.py 123.txt chapter9_dictdatas_audit.txt
          cat chapter9_dictdatas_audit.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload focused report
        uses: actions/upload-artifact@v4
        with:
          name: chapter9-dictdatas-audit
          path: chapter9_dictdatas_audit.txt
          if-no-files-found: error
          retention-days: 7
